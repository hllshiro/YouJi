name: Build App

on:
  # 允许在 GitHub Actions 页面手动触发
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release
      upload_apk:
        description: 上传 APK 作为产物
        required: false
        type: boolean
        default: true

# 同一分支+构建类型的新运行会取消正在进行的旧运行
concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.build_type || 'debug' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Gradle 配置：禁用 daemon（CI 环境每次都是新进程）
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx2048m"
      # Android SDK 路径（ubuntu-latest 预装位置）
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing keystore from GitHub Secrets
        env:
          YJ_KEYSTORE_BASE64: ${{ secrets.YJ_KEYSTORE_BASE64 }}
        run: |
          # Release 构建要求必须配置签名；Debug 允许缺失（会回退到默认 debug.keystore）
          mkdir -p app/keystore
          KEYSTORE_PATH="$GITHUB_WORKSPACE/app/keystore/youji.jks"
          echo "keystore_path=${KEYSTORE_PATH}" >> "$GITHUB_ENV"

          if [ -z "${YJ_KEYSTORE_BASE64}" ]; then
            if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
              echo "::error::Release build requires secret YJ_KEYSTORE_BASE64, but it is empty. Configure it under repo Settings → Secrets and variables → Actions."
              exit 1
            fi
            echo "::warning::Secret YJ_KEYSTORE_BASE64 not set. Debug build will fall back to default debug.keystore (APK signature inconsistent across runs)."
            exit 0
          fi

          # 安全还原：先去除所有空白字符（换行/空格/制表符），再 base64 解码到文件
          # 这样即使粘贴 secret 时被编辑器自动折行也能正常工作
          CLEAN_B64=$(printf '%s' "${YJ_KEYSTORE_BASE64}" | tr -d '[:space:]')
          printf '%s' "${CLEAN_B64}" | base64 -d > "${KEYSTORE_PATH}"

          # 基础校验：文件存在且为非空
          if [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "::error::Keystore restored but empty or invalid base64. Length of cleaned input: ${#CLEAN_B64}"
            exit 1
          fi

          chmod 600 "${KEYSTORE_PATH}"
          # 只打印大小和清理后的字符数，不打印可能泄露的任何字节
          echo "✅ Keystore restored, size=$(stat -c%s "${KEYSTORE_PATH}") bytes, base64 length=${#CLEAN_B64}"

      - name: Verify / install Android SDK components
        run: |
          # ubuntu-latest 已预装 Android SDK 到 /usr/local/lib/android/sdk
          # 先确认 platform-34 与 build-tools 34 存在；若缺失再通过 sdkmanager 补齐（非强制）
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "SDK_ROOT=${SDK_ROOT}"
          echo "--- Pre-installed platforms ---"
          ls -1 "${SDK_ROOT}/platforms" 2>/dev/null || echo "(none)"
          echo "--- Pre-installed build-tools ---"
          ls -1 "${SDK_ROOT}/build-tools" 2>/dev/null || echo "(none)"

          if [ -d "${SDK_ROOT}/platforms/android-34" ] && \
             ls -d "${SDK_ROOT}/build-tools/34."* 1>/dev/null 2>&1; then
            echo "✅ platforms;android-34 与 build-tools 34.x 已存在，跳过安装"
            exit 0
          fi

          echo "⚠️  SDK 组件缺失，尝试使用 sdkmanager 补齐"
          SDKMANAGER=$(find "${SDK_ROOT}" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: 未找到 sdkmanager"
            exit 1
          fi
          echo "Using sdkmanager at: ${SDKMANAGER}"
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses || true
          "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            --verbose || true

          # 二次确认
          if [ -d "${SDK_ROOT}/platforms/android-34" ] && \
             ls -d "${SDK_ROOT}/build-tools/34."* 1>/dev/null 2>&1; then
            echo "✅ SDK 组件安装完成"
          else
            echo "::warning::部分SDK组件仍缺失，后续 Gradle 会再尝试自动下载"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 使用项目自带的 gradlew 包装器（gradle-wrapper.properties 锁定 Gradle 8.9）
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Generate local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          cat local.properties

      - name: Print environment
        run: |
          echo "=== Java ==="
          java -version
          echo "=== Gradle wrapper ==="
          ./gradlew --version

      - name: Build debug APK
        if: github.event.inputs.build_type != 'release'
        env:
          YJ_STORE_PASSWORD: ${{ secrets.YJ_STORE_PASSWORD }}
          YJ_KEY_ALIAS:      ${{ secrets.YJ_KEY_ALIAS }}
          YJ_KEY_PASSWORD:   ${{ secrets.YJ_KEY_PASSWORD }}
        run: |
          # 仅当 secret 齐全才注入统一签名；否则回退到默认 debug keystore（CI友好）
          SIGN_ARGS=()
          if [ -n "${keystore_path:-}" ] && \
             [ -n "${YJ_STORE_PASSWORD}" ] && \
             [ -n "${YJ_KEY_ALIAS}" ] && \
             [ -n "${YJ_KEY_PASSWORD}" ]; then
            SIGN_ARGS+=(
              -Pyouji.storeFile="${keystore_path}"
              -Pyouji.storePassword="${YJ_STORE_PASSWORD}"
              -Pyouji.keyAlias="${YJ_KEY_ALIAS}"
              -Pyouji.keyPassword="${YJ_KEY_PASSWORD}"
            )
          else
            echo "::warning::Signing secrets incomplete; debug build will use default android debug keystore."
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace "${SIGN_ARGS[@]}"

      - name: Build release APK
        if: github.event.inputs.build_type == 'release'
        env:
          YJ_STORE_PASSWORD: ${{ secrets.YJ_STORE_PASSWORD }}
          YJ_KEY_ALIAS:      ${{ secrets.YJ_KEY_ALIAS }}
          YJ_KEY_PASSWORD:   ${{ secrets.YJ_KEY_PASSWORD }}
        run: |
          if [ -z "${keystore_path:-}" ] || [ ! -f "${keystore_path}" ]; then
            echo "::error::Release build requires YJ_KEYSTORE_BASE64 secret (keystore missing)."
            exit 1
          fi
          if [ -z "${YJ_STORE_PASSWORD}" ] || [ -z "${YJ_KEY_ALIAS}" ] || [ -z "${YJ_KEY_PASSWORD}" ]; then
            echo "::error::Release build requires YJ_STORE_PASSWORD / YJ_KEY_ALIAS / YJ_KEY_PASSWORD secrets."
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pyouji.storeFile="${keystore_path}" \
            -Pyouji.storePassword="${YJ_STORE_PASSWORD}" \
            -Pyouji.keyAlias="${YJ_KEY_ALIAS}" \
            -Pyouji.keyPassword="${YJ_KEY_PASSWORD}"

      - name: Locate built APK
        id: apk
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            APK_DIR="app/build/outputs/apk/release"
            APK_NAME="app-release.apk"
          else
            APK_DIR="app/build/outputs/apk/debug"
            APK_NAME="app-debug.apk"
          fi
          APK_PATH="${APK_DIR}/${APK_NAME}"
          if [ ! -f "${APK_PATH}" ]; then
            echo "ERROR: APK not found at ${APK_PATH}"
            ls -la "${APK_DIR}" || true
            exit 1
          fi
          echo "path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "Found APK: ${APK_PATH}"
          ls -lh "${APK_PATH}"

      - name: Compute checksum
        run: |
          cd "$(dirname "${{ steps.apk.outputs.path }}")"
          FILE="$(basename "${{ steps.apk.outputs.path }}")"
          md5sum  "${FILE}" > "${FILE}.md5"
          sha256sum "${FILE}" > "${FILE}.sha256"
          echo "=== Checksums ==="
          cat "${FILE}.md5" "${FILE}.sha256"

      - name: Upload APK artifact
        if: github.event.inputs.upload_apk != 'false'
        uses: actions/upload-artifact@v5
        with:
          name: youji-${{ github.event.inputs.build_type || 'debug' }}-${{ github.sha }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.md5
            ${{ steps.apk.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0  # APK 已是压缩格式，不再二次压缩

      - name: Summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "- **Status**: ${{ job.status }}"
            echo "- **Build type**: ${{ github.event.inputs.build_type || 'debug' }}"
            echo "- **Commit**: ${{ github.sha }}"
            echo "- **Branch**: ${{ github.ref_name }}"
            if [ -f "${{ steps.apk.outputs.path }}" ]; then
              SIZE=$(du -h "${{ steps.apk.outputs.path }}" | cut -f1)
              echo "- **APK size**: \`${SIZE}\`"
              echo "- **APK path**: \`${{ steps.apk.outputs.path }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
